# Free Supabase projects pause after 7 days without activity.
# A small daily read keeps the database awake (e.g. during international breaks).
name: Keep database awake

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 09:17 Riyadh time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.js
          sparse-checkout-cone-mode: false
      - name: Query the database
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js)
          KEY=$(grep -o "eyJ[^']*" config.js)
          code=$(curl -s -o /tmp/out -w "%{http_code}" --retry 3 --retry-delay 20 \
            "$URL/rest/v1/match_locks?select=match_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; cat /tmp/out; echo
          if [ "$code" != "200" ]; then
            echo "::error::Database did not respond. It may be paused: open the Supabase dashboard and press Restore project."
            exit 1
          fi
